name: test_and_build

on:
    push:
        branches:
            - 'feature/**'
            - 'dev'
            - 'main'

jobs:
    test_and_build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: '3.14'
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install .
                  python -m pip install ".[dev]"
            - name: Run tests
              run: |
                  pytest
            - name: Test linting
              run: |
                  mypy .
                  ruff check .